# Public-holiday names from the `holidays` package to ignore, per region. New York's
# package calendar includes state commemorations that don't close Buffalo schools: Lincoln's
# Birthday (Feb 12) and Susan B. Anthony Day (Feb 15) aren't on the Buffalo no-school list
# (Feb 15 2027 is off anyway, as Presidents' Day, listed above). Election Day and Veterans
# Day DO close Buffalo schools, so those stay.
exclude_holidays:
  "NY":
    - "Lincoln's Birthday"
    - "Susan B. Anthony Day"
