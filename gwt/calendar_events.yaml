# School-closure calendar for Great Wolf Tracker
# ==============================================
#
# Used to mark "extra" nights: a night is flagged for a region when the NEXT MORNING is a
# school-closure day for that region (a break, PA day or holiday) and is not a regular
# weekend day (Saturday/Sunday). Those are the nights families can stay without missing
# school. Public holidays for Ontario (CA-ON) and New York (US-NY) are merged in
# automatically from the `holidays` Python package, so they don't need to be listed here;
# but on a day a school-board entry covers, the board entry is the only label shown.
# Names under exclude_holidays (bottom of the file) are dropped from the package's list.
#
# Fields
#   region    "ON" (Ontario) or "NY" (New York). Keep the quotes: unquoted ON means "true" in YAML.
#   name      shown in tooltips and tags
#   start     first closure day, YYYY-MM-DD
#   end       last closure day, inclusive
#   source    where the date came from (cite it)
#   official  true if the source is the school board itself, false for third-party compilations
#   closure   optional, default true. false = informational only (shown as a tag, never flags a night)
#
# Adding next school year
#   Append entries for the new year when the boards publish their calendars, with the source
#   URL. Don't guess dates. Either edit this file and rebuild the image, or copy it next to
#   the database (e.g. /app/data/calendar_events.yaml) and set GWT_EVENTS_FILE to that path
#   so it can be edited without a rebuild.
#
# TODO: Ontario (TDSB) summer break 2027 and all of the 2027-28 school year: add when the
#       board publishes its calendar.
# TODO: Buffalo Public Schools 2027-28: the end of summer recess 2027 (first day of school)
#       and the 2027-28 breaks are not known yet.

events:
