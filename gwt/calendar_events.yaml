    name: Winter break
    start: 2026-12-21
    end: 2027-01-01
    source: https://www.tdsb.on.ca/Portals/0/docs/2026-27%20TDSB%20School%20Year%20Calendar%20Key%20Dates.pdf
    official: true
  - region: "ON"
